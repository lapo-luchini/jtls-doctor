plugins {
    id 'java'
    id 'application'
}

version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

application {
    mainClass = 'jtlsdoctor.Main'
}

jar {
    manifest {
        attributes 'Main-Class': 'jtlsdoctor.Main'
    }
}
